<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fun Hacks Radar">
  <rect width="64" height="64" rx="14" fill="#0B2E1F"/>
  <!-- radar rings -->
  <circle cx="32" cy="38" r="22" fill="none" stroke="#F5A524" stroke-width="1.5" opacity="0.35"/>
  <circle cx="32" cy="38" r="15" fill="none" stroke="#F5A524" stroke-width="1.5" opacity="0.55"/>
  <circle cx="32" cy="38" r="8" fill="none" stroke="#F5A524" stroke-width="1.5" opacity="0.75"/>
  <!-- volcano cone -->
  <path d="M18 46 L28 22 L32 30 L36 18 L46 46 Z" fill="#F5A524"/>
  <!-- crater glow -->
  <ellipse cx="32" cy="22" rx="5" ry="2.2" fill="#FFD27A"/>
  <!-- radar sweep tip / blip -->
  <circle cx="44" cy="28" r="2.4" fill="#FFD27A"/>
  <path d="M32 38 L44 28" stroke="#FFD27A" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <!-- base -->
  <rect x="16" y="46" width="32" height="3" rx="1.5" fill="#C4781A" opacity="0.9"/>
</svg>
